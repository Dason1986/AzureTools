parameters:
  - name: rid
    type: string
  - name: dotnetChannel
    type: string
  - name: projectFile
    type: string
  - name: selectedTargetRid
    type: string

steps:
- bash: |
    set -e
    selected='${{ parameters.selectedTargetRid }}'
    currentRid='${{ parameters.rid }}'
    echo "输入选择:$selected, 当前构建:$currentRid"

    if [[ "$selected" != "All" && "$selected" != "$currentRid" ]]; then
        echo "===== 跳过 $currentRid ====="
        exit 0
    fi
    echo ""
    echo "====================================="
    echo "开始构建 $currentRid AOT"
    echo "====================================="
    echo ""
  displayName: 条件判断 ${{ parameters.rid }}

- bash: |
    set -e
    installDir="${AGENT_TOOLSDIRECTORY}/dotnet"
    curl -sSL https://dotnet.microsoft.com/download/dotnet/scripts/v1/dotnet-install.sh > dotnet-install.sh
    chmod +x dotnet-install.sh
    ./dotnet-install.sh --channel ${{ parameters.dotnetChannel }} --install-dir "$installDir"
  displayName: Install .NET SDK ${{ parameters.rid }}

- script: echo "##vso[task.prependpath]${AGENT_TOOLSDIRECTORY}/dotnet"
  displayName: Add dotnet PATH

- bash: dotnet --version
  displayName: Check SDK ${{ parameters.rid }}

- bash: |
    set -e
    rid='${{ parameters.rid }}'
    outDir="${BUILD_ARTIFACTSTAGINGDIRECTORY}/publish/aot_${rid}"
    zipPath="${BUILD_ARTIFACTSTAGINGDIRECTORY}/AzureTools-${rid}-AOT.zip"

    rm -rf "$outDir"
    mkdir -p "$outDir"

    dotnet publish "${{ parameters.projectFile }}" \
      -c Release \
      -r "$rid" \
      -p:PublishAot=true \
      -p:DebugType=None \
      -p:DebugSymbols=false \
      -o "$outDir"

    rm -f "$zipPath"
    cd "$outDir"
    zip -r "$zipPath" ./*
  displayName: Publish & Zip AOT ${{ parameters.rid }}

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/AzureTools-${{ parameters.rid }}-AOT.zip'
    ArtifactName: AzureTools-AOT-${{ parameters.rid }}
  displayName: Upload artifact ${{ parameters.rid }}
