parameters:
  - name: rid
    type: string
  - name: dotnetChannel
    type: string
  - name: projectFile
    type: string
  - name: selectedTargetRid
    type: string

steps:
- powershell: |
    $selected = '${{ parameters.selectedTargetRid }}'
    $currentRid = '${{ parameters.rid }}'
    Write-Host "输入选择:$selected, 当前构建:$currentRid"

    if ($selected -ne 'All' -and $selected -ne $currentRid)
    {
        Write-Host "===== 跳过 $currentRid ====="
        exit 0
    }
    Write-Host "`n====================================="
    Write-Host "开始构建 $currentRid AOT"
    Write-Host "=====================================`n"
  displayName: 条件判断 ${{ parameters.rid }}

- powershell: |
    $ErrorActionPreference = 'Stop'
    $installDir = "$(Agent.ToolsDirectory)/dotnet"
    Invoke-WebRequest -Uri "https://dotnet.microsoft.com/download/dotnet/scripts/v1/dotnet-install.ps1" -OutFile dotnet-install.ps1
    .\dotnet-install.ps1 -Channel ${{ parameters.dotnetChannel }} -InstallDir $installDir
  displayName: Install .NET SDK ${{ parameters.rid }}

- script: echo ##vso[task.prependpath]$(Agent.ToolsDirectory)/dotnet
  displayName: Add dotnet PATH

- script: dotnet --version
  displayName: Check SDK ${{ parameters.rid }}

- powershell: |
    $ErrorActionPreference = 'Stop'
    $rid = '${{ parameters.rid }}'
    $outDir = "$(Build.ArtifactStagingDirectory)/publish/aot_$rid"
    $zipPath = "$(Build.ArtifactStagingDirectory)/AzureTools-$rid-AOT.zip"

    if(Test-Path $outDir)
    {
        Remove-Item $outDir -Recurse -Force
    }
    New-Item -ItemType Directory -Path $outDir -Force | Out-Null

    dotnet publish "${{ parameters.projectFile }}" `
      -c Release `
      -r $rid `
      -p:PublishAot=true `
      -p:PublishSingleFile=true `
      -p:DebugType=None `
      -p:DebugSymbols=false `
      -o $outDir

    if(Test-Path $zipPath) { Remove-Item $zipPath -Force }
    Compress-Archive -Path "$outDir\*" -DestinationPath $zipPath
  displayName: Publish & Zip AOT ${{ parameters.rid }}

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/AzureTools-${{ parameters.rid }}-AOT.zip'
    ArtifactName: AzureTools-AOT-${{ parameters.rid }}
  displayName: Upload artifact ${{ parameters.rid }}
