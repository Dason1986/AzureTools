parameters:
- name: TargetRID
  displayName: 目标运行时架构
  type: string
  default: All
  values:
    - All
    - win-x64
    - win-arm64



pool:
  vmImage: windows-latest

variables:
  DOTNET_CHANNEL: '10.0'
  PROJECT_FILE: src/AzureTools/AzureTools.csproj

steps:

- powershell: |
    $ErrorActionPreference = 'Stop'
    Write-Host "安装 VC ARM64 编译工具链"
    Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_BuildTools.exe" -OutFile vs_BuildTools.exe
    .\vs_BuildTools.exe --quiet --norestart --wait `
    --add Microsoft.VisualStudio.Component.Windows11SDK.22621 `
    --add Microsoft.VisualStudio.Component.VC.ARM64.Tools `
    --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64
  displayName: Install VS BuildTools once

# 构建 win-x64
- template: templates/build-aot-win-step.yml
  parameters:
    rid: win-x64
    dotnetChannel: $(DOTNET_CHANNEL)
    projectFile: $(PROJECT_FILE)
    selectedTargetRid: ${{ parameters.TargetRID }}

# 构建 win-arm64（串行在后）
- template: templates/build-aot-win-step.yml
  parameters:
    rid: win-arm64
    dotnetChannel: $(DOTNET_CHANNEL)
    projectFile: $(PROJECT_FILE)
    selectedTargetRid: ${{ parameters.TargetRID }}
